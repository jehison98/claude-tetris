<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tetris</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="stage">
      <header class="top-bar">
        <h1 class="title">TETRIS</h1>
        <button id="theme-toggle" type="button" tabindex="-1" aria-label="Cambiar entre tema claro y oscuro">
          ☀ Claro
        </button>
      </header>

      <div class="wrapper">
        <div class="game-container">
          <canvas id="board" width="300" height="600"></canvas>

          <aside class="panel">
            <div class="panel-section">
              <span class="label">SCORE</span>
              <span class="value" id="score">0</span>
            </div>
            <div class="panel-section">
              <span class="label">LINES</span>
              <span class="value" id="lines">0</span>
            </div>
            <div class="panel-section">
              <span class="label">LEVEL</span>
              <span class="value" id="level">1</span>
            </div>

            <div class="panel-section">
              <span class="label">NEXT</span>
              <canvas id="next-canvas" width="120" height="120"></canvas>
            </div>

            <div class="panel-section controls">
              <span class="label">CONTROLS</span>
              <ul>
                <li><kbd>←</kbd><kbd>→</kbd> mover</li>
                <li><kbd>↑</kbd> rotar</li>
                <li><kbd>↓</kbd> bajar</li>
                <li><kbd>Space</kbd> caída</li>
                <li><kbd>P</kbd> pausa</li>
              </ul>
            </div>
          </aside>
        </div>

        <div id="overlay" class="overlay hidden">
          <div class="overlay-box">
            <p id="overlay-title">GAME OVER</p>
            <p id="overlay-score"></p>
            <div id="gameover-extra" class="records-box hidden">
              <div id="name-entry" class="name-entry hidden">
                <label for="name-input">¡Entras en el top 5! Tu nombre:</label>
                <div class="name-row">
                  <input id="name-input" type="text" maxlength="12" autocomplete="off" placeholder="Anónimo" />
                  <button id="name-save-btn" type="button">Guardar</button>
                </div>
              </div>
              <table class="records">
                <thead>
                  <tr><th>#</th><th>Nombre</th><th>Puntos</th><th>Líneas</th></tr>
                </thead>
                <tbody id="over-records"></tbody>
              </table>
              <p id="over-bests" class="bests"></p>
              <button id="over-reset-btn" class="link-btn" type="button">Borrar records</button>
            </div>
            <button id="restart-btn">Reiniciar</button>
          </div>
        </div>

        <div id="start-screen" class="overlay">
          <div class="overlay-box">
            <p class="start-title">RECORDS</p>
            <table class="records">
              <thead>
                <tr><th>#</th><th>Nombre</th><th>Puntos</th><th>Líneas</th></tr>
              </thead>
              <tbody id="start-records"></tbody>
            </table>
            <p id="start-bests" class="bests"></p>
            <button id="start-btn" type="button">Jugar</button>
            <button id="start-reset-btn" class="link-btn" type="button">Borrar records</button>
          </div>
        </div>
      </div>
    </main>

    <script src="game.js"></script>
  </body>
</html>
