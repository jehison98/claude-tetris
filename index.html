<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tetris</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="stage">
      <header class="top-bar">
        <h1 class="title">TETRIS</h1>
        <button id="theme-toggle" type="button" tabindex="-1" aria-label="Cambiar entre tema claro y oscuro">
          ☀ Claro
        </button>
      </header>

      <div class="wrapper">
        <div class="game-container">
          <canvas id="board" width="300" height="600"></canvas>

          <aside class="panel">
            <div class="panel-section">
              <span class="label">SCORE</span>
              <span class="value" id="score">0</span>
            </div>
            <div class="panel-section">
              <span class="label">LINES</span>
              <span class="value" id="lines">0</span>
            </div>
            <div class="panel-section">
              <span class="label">LEVEL</span>
              <span class="value" id="level">1</span>
            </div>

            <div class="panel-section">
              <span class="label">NEXT</span>
              <canvas id="next-canvas" width="120" height="120"></canvas>
            </div>

            <div class="panel-section controls">
              <span class="label">CONTROLS</span>
              <ul>
                <li><kbd>←</kbd><kbd>→</kbd> mover</li>
                <li><kbd>↑</kbd> rotar</li>
                <li><kbd>↓</kbd> bajar</li>
                <li><kbd>Space</kbd> caída</li>
                <li><kbd>P</kbd> pausa</li>
              </ul>
            </div>
          </aside>
        </div>

        <div id="overlay" class="overlay hidden">
          <div class="overlay-box">
            <p id="overlay-title">GAME OVER</p>
            <p id="overlay-score"></p>

            <form id="record-form" class="hidden" autocomplete="off">
              <p id="record-msg">¡Nuevo récord! Escribe tu nombre</p>
              <div class="record-input-row">
                <input id="name-input" type="text" maxlength="12" placeholder="Nombre" aria-label="Nombre del jugador" />
                <button id="save-record-btn" type="submit">Guardar</button>
              </div>
            </form>

            <section id="records" class="records">
              <span class="label">TOP 5</span>
              <ol id="records-list"></ol>
              <p id="records-extra"></p>
            </section>

            <button id="restart-btn">Reiniciar</button>
            <button id="reset-records-btn" type="button">Resetear records</button>
          </div>
        </div>
      </div>
    </main>

    <script src="game.js"></script>
  </body>
</html>
