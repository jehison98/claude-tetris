<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tetris</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="stage">
      <header class="top-bar">
        <h1 class="title">TETRIS</h1>
        <button id="theme-toggle" type="button" tabindex="-1" aria-label="Cambiar entre tema claro y oscuro">
          ☀ Claro
        </button>
      </header>

      <div class="wrapper">
        <div class="game-container">
          <canvas id="board" width="300" height="600"></canvas>

          <aside class="panel">
            <div class="panel-section">
              <span class="label">SCORE</span>
              <span class="value" id="score">0</span>
            </div>
            <div class="panel-section">
              <span class="label">LINES</span>
              <span class="value" id="lines">0</span>
            </div>
            <div class="panel-section">
              <span class="label">LEVEL</span>
              <span class="value" id="level">1</span>
            </div>

            <div class="panel-section">
              <span class="label">NEXT</span>
              <canvas id="next-canvas" width="120" height="120"></canvas>
            </div>

            <div class="panel-section controls">
              <span class="label">CONTROLS</span>
              <ul>
                <li><kbd>←</kbd><kbd>→</kbd> mover</li>
                <li><kbd>↑</kbd> rotar</li>
                <li><kbd>↓</kbd> bajar</li>
                <li><kbd>Space</kbd> caída</li>
                <li><kbd>P</kbd> pausa</li>
              </ul>
            </div>
          </aside>
        </div>

        <div id="overlay" class="overlay hidden">
          <div class="overlay-box">
            <p id="overlay-title">GAME OVER</p>
            <p id="overlay-score"></p>
            <button id="restart-btn">Reiniciar</button>
          </div>
        </div>

        <div id="pause-menu" class="overlay hidden" role="dialog" aria-label="Menú de pausa">
          <div class="overlay-box pause-box">
            <p id="pause-title">PAUSA</p>
            <button type="button" class="menu-item" id="resume-btn" tabindex="-1">Reanudar</button>
            <button type="button" class="menu-item" id="pause-restart-btn" tabindex="-1">Reiniciar</button>
            <button type="button" class="menu-item" id="controls-btn" tabindex="-1" aria-expanded="false">
              Ver controles
            </button>
            <ul id="pause-controls" class="hidden">
              <li><kbd>←</kbd><kbd>→</kbd> mover</li>
              <li><kbd>↑</kbd> o <kbd>X</kbd> rotar</li>
              <li><kbd>↓</kbd> bajar</li>
              <li><kbd>Space</kbd> caída</li>
              <li><kbd>P</kbd> o <kbd>Esc</kbd> pausa</li>
            </ul>
            <div class="menu-item level-row" id="level-row">
              <span>Nivel inicial</span>
              <span class="level-picker">
                <button type="button" id="level-down" tabindex="-1" aria-label="Bajar nivel inicial">‹</button>
                <span id="start-level-value">1</span>
                <button type="button" id="level-up" tabindex="-1" aria-label="Subir nivel inicial">›</button>
              </span>
            </div>
            <p class="menu-hint">↑ ↓ Enter · ← → cambia nivel</p>
          </div>
        </div>
      </div>
    </main>

    <script src="game.js"></script>
  </body>
</html>
